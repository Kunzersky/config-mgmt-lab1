[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unix-shell-emulator"
version = "0.1.0"
description = "A small UNIX shell emulator backed by an in-memory ZIP filesystem."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
unix-shell = "src.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
